<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090a" />
    <meta name="description" content="Portfolio — developer building fast, considered software for the web." />
    <title>Portfolio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap"
    />
  </head>
  <body class="is-loading">
    <canvas id="webgl" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="loader" aria-hidden="true">
      <div class="loader__top mono"><span data-initials></span><span>Calibrating scene</span></div>
      <div class="loader__count display"><span data-loader-count>000</span></div>
      <div class="loader__bar"><i></i></div>
    </div>

    <div class="hud mono" aria-hidden="true">
      <i class="hud__corner hud__corner--tl"></i>
      <i class="hud__corner hud__corner--tr"></i>
      <i class="hud__corner hud__corner--bl"></i>
      <i class="hud__corner hud__corner--br"></i>
      <div class="hud__section"><span data-hud-index>00</span><span class="hud__sep"></span><span data-hud-name>Intro</span></div>
      <div class="hud__progress"><i></i></div>
    </div>

    <div class="cursor" aria-hidden="true">
      <div class="cursor__dot"></div>
      <div class="cursor__ring"><div class="cursor__ring-inner"><span class="cursor__label mono"></span></div></div>
    </div>

    <div id="app"></div>

    <div class="grain" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
